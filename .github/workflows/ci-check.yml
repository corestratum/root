# CI check workflow for /root — runs on every PR and on push to main.
# Implements the required CI gates per ADR-0001.
# Self-contained: only the jobs this repo (an Astro docs site) actually
# needs. Other repos in the corestratum org keep their own tailored copy
# instead of sharing one guarded, multi-repo template.
# Last verified: 2026-09 against actions/checkout@v4, GHA runner ubuntu-24.04

name: ci-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs for the same PR when new commits land.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # yaml-lint
  # ─────────────────────────────────────────────────────────────────────
  yaml-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint
        # Uses .yamllint config from the repo root (auto-discovered).
        # Config ignores Helm templates + relaxes a few over-strict rules.
        run: yamllint .

  # ─────────────────────────────────────────────────────────────────────
  # gitleaks — secret scanning, run via the raw CLI instead of
  # gitleaks/gitleaks-action. The Action now requires a paid
  # GITLEAKS_LICENSE for any repo owned by a GitHub organization
  # (corestratum, in this case), public or not — the underlying gitleaks
  # binary itself stays free and open-source either way, so this skips
  # the Action wrapper entirely rather than carrying a paid dependency.
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history needed for gitleaks
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --exit-code 1
